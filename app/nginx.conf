server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript application/json application/wasm image/svg+xml;

  # Caching uses `expires` only: an add_header inside a location would drop
  # these server-level headers there.
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # Default: revalidate (Cache-Control: no-cache). Covers index.html,
  # flutter_bootstrap.js, main.dart.js,
  # version.json, manifest.json, canvaskit/ and the asset manifests, whose
  # names stay the same while their content changes with every build.
  expires -1;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Images, fonts and icons: long-lived (font-fallback/ paths are versioned).
  location ~ ^/(assets/.+\.(png|jpe?g|svg|webp|ttf|otf|woff2?)|icons/.+|font-fallback/.+|favicon\.png)$ {
    expires 30d;
    try_files $uri =404;
  }
}
