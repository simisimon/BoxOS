services:
  db-dev:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: boxos
      POSTGRES_PASSWORD: boxos
      POSTGRES_DB: boxos
    volumes:
      - backend_dev_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boxos -d boxos"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  backend-dev:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db-dev:
        condition: service_healthy
    working_dir: /app
    command: ["python", "-m", "uvicorn", "backend.fastapi_app:app", "--reload", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "8081:8080"
    environment:
      BOXOS_HOST: 0.0.0.0
      BOXOS_PORT: 8080
      BOXOS_DATABASE_URL: postgresql://boxos:boxos@db-dev:5432/boxos
      BOXOS_UPLOADS_ROOT: /app/uploads
    volumes:
      - ./backend:/app/backend
      - backend_dev_uploads:/app/uploads

  frontend-dev:
    image: ghcr.io/cirruslabs/flutter:stable
    restart: unless-stopped
    depends_on:
      - backend-dev
    working_dir: /workspace/app
    # Offline pub get skips pub.dev when the cache is complete; an online
    # fetch that stalls is cut off after 5 min and the container restarts.
    command:
      - sh
      - -lc
      - >-
        rm -f /tmp/flutter-run.log &&
        flutter config --enable-web &&
        (flutter pub get --offline || timeout 300 flutter pub get) &&
        flutter run -d web-server --no-pub
        --web-hostname 0.0.0.0
        --web-port 3000
        --dart-define=ENV=dev
        --dart-define=API_BASE_URL=http://localhost:8081
        --dart-define=AUTH_REDIRECT_URL=http://localhost:3001/auth/callback
        2>&1 | tee /tmp/flutter-run.log
    # Port 3000 answers before the compile is done and a page opened then stays
    # blank, so "healthy" waits for flutter's own "is being served" line.
    healthcheck:
      test: ["CMD", "grep", "-q", "is being served", "/tmp/flutter-run.log"]
      interval: 5s
      timeout: 3s
      start_period: 10m
      start_interval: 2s
    ports:
      - "3001:3000"
    volumes:
      - ./app:/workspace/app
      - flutter_pub_cache:/root/.pub-cache

volumes:
  backend_dev_db:
  backend_dev_uploads:
  flutter_pub_cache:
